name: Check release package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.9
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun pm pack --filename dappa-video-0.1.0.tgz
      - run: bun run test:consumer ./dappa-video-0.1.0.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-evidence
          path: artifacts/consumer/
